<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banpay Challenge - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'media'
        }
    </script>
</head>

<body class="bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100 min-h-screen transition-colors duration-300">

    <nav class="bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 p-4 shadow-sm">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <span class="text-2xl font-bold text-blue-600 dark:text-blue-400 tracking-wide">banpay</span>
            <div class="flex items-center gap-4">
                <a href="/admin" id="btnGoAdmin"
                    class="text-sm text-blue-600 dark:text-blue-400 hover:underline font-medium hidden pl-10">Panel
                    Admin</a>

                <span id="userRoleBadge"
                    class="text-sm bg-blue-100 dark:bg-blue-900/40 text-blue-800 dark:text-blue-300 px-3 py-1 rounded-full font-medium">
                    Cargando rol...
                </span>
                <button onclick="logout()" class="text-sm text-red-500 hover:underline font-medium">Cerrar
                    Sesión</button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6 space-y-6">

        <div class="bg-white dark:bg-gray-900 p-6 rounded-2xl border dark:border-gray-800 shadow-sm space-y-4">
            <div>
                <h2 class="text-2xl font-bold tracking-tight">Portal de Consultas Ghibli</h2>
                <p class="text-sm text-gray-500 dark:text-gray-400 mt-1" id="welcomeText">
                    Bienvenido al sistema de consultas.
                </p>
            </div>

            <div id="adminResourceContainer" class="hidden">
                <label class="block text-sm font-medium text-gray-400 mb-2">Selecciona la categoría a consultar:</label>
                <select id="resourceSelect"
                    class="w-full sm:w-64 px-4 py-3 rounded-xl border dark:border-gray-700 bg-gray-50 dark:bg-gray-800 focus:ring-2 focus:ring-blue-500 outline-none transition font-medium">
                    <option value="films" selected>films (Películas)</option>
                    <option value="people">people (Personajes)</option>
                    <option value="locations">locations (Lugares)</option>
                    <option value="species">species (Especies)</option>
                    <option value="vehicles">vehicles (Vehículos)</option>
                </select>
            </div>
        </div>

        <div id="resultsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-12 text-gray-400">
                Cargando datos del servidor...
            </div>
        </div>

    </main>

    <script>
        const userId = sessionStorage.getItem('userId');
        const userRole = sessionStorage.getItem('userRole');

        if (!userId || !userRole) {
            alert("Acceso denegado: Inicia sesión primero.");
            window.location.href = "/";
        }

        // Elementos de la interfaz
        document.getElementById('userRoleBadge').innerText = `Rol: ${userRole}`;
        const welcomeText = document.getElementById('welcomeText');
        const adminResourceContainer = document.getElementById('adminResourceContainer');
        const resourceSelect = document.getElementById('resourceSelect');
        const resultsGrid = document.getElementById('resultsGrid');
        const btnGoAdmin = document.getElementById('btnGoAdmin');


        if (userRole === 'admin') {
            welcomeText.innerHTML = 'Tienes permisos de <span class="font-semibold text-red-500">Administrador</span>. Explora los endpoints utilizando el seleccionador de abajo.';
            adminResourceContainer.classList.remove('hidden');
            btnGoAdmin.classList.remove('hidden');
        } else {
            welcomeText.innerHTML = `Tu perfil te otorga acceso exclusivo a las consultas automáticas del recurso de: <span class="font-semibold text-blue-600 dark:text-blue-400">${userRole}</span>.`;
        }

        async function cargarDatosGhibli() {
            const selectedResource = userRole === 'admin' ? resourceSelect.value : 'films';

            resultsGrid.innerHTML = `
                <div class="col-span-full text-center py-12 text-blue-600 dark:text-blue-400">
                    <p class="text-lg animate-pulse font-medium">Consultando Gateway de Python de forma segura...</p>
                </div>
            `;

            try {
                const response = await fetch(`/api/ghibli?resource=${selectedResource}`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-User-Id': userId
                    }
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || 'Error en las consultas.');
                }

                const data = await response.json();
                renderCards(data.resultados);

            } catch (error) {
                resultsGrid.innerHTML = `
                    <div class="col-span-full text-center py-12 text-red-500">
                        <p class="text-lg font-medium">Error: ${error.message}</p>
                    </div>
                `;
            }
        }

        function renderCards(items) {
            const resultsGrid = document.getElementById('resultsGrid');

            if (!items || items.length === 0) {
                resultsGrid.innerHTML = `
            <div class="col-span-full text-center py-12 text-gray-500">
                <p class="text-lg">No se encontraron resultados en esta categoría.</p>
            </div>
        `;
                return;
            }

            resultsGrid.innerHTML = items.map(item => {
                let imageHtml = '';
                if (item.cover_image) {
                    imageHtml = `
                <div class="flex-shrink-0 w-20 h-28 ml-4 self-start shadow-md rounded-lg overflow-hidden border dark:border-gray-800">
                    <img 
                        src="${item.cover_image}" 
                        alt="${item.title_or_name}" 
                        class="w-full h-full object-cover transition duration-300 hover:scale-105"
                        loading="lazy"
                    >
                </div>
            `;
                }

                return `
            <div class="bg-white dark:bg-gray-900 p-6 rounded-2xl border dark:border-gray-800 shadow-sm hover:shadow-md transition duration-200 flex flex-col justify-between">
                <div>
                    <span class="text-xs font-semibold text-blue-600 dark:text-blue-400 uppercase tracking-wider block mb-1">
                        ${item.resource_type}
                    </span>
                    
                    <div class="flex justify-between items-start gap-2 mb-3">
                        <div class="flex-1">
                            <h3 class="font-bold text-lg leading-snug text-gray-900 dark:text-gray-50 mb-2 line-clamp-2">
                                ${item.title_or_name}
                            </h3>
                            <p class="text-sm text-gray-600 dark:text-gray-400 line-clamp-4">
                                ${item.description}
                            </p>
                        </div>
                        
                        ${imageHtml}
                    </div>
                </div>
                
                <div class="pt-4 border-t border-gray-100 dark:border-gray-800 text-xs text-gray-400 dark:text-gray-500 font-medium">
                    ${item.extra_detail}
                </div>
            </div>
        `;
            }).join('');
        }

        resourceSelect.addEventListener('change', () => {
            if (userRole === 'admin') cargarDatosGhibli();
        });

        function logout() {
            sessionStorage.clear();
            window.location.href = "/";
        }

        cargarDatosGhibli();
    </script>
</body>

</html>
