<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banpay Challenge - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'media'
        }
    </script>
</head>

<body
    class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 min-h-screen flex items-center justify-center p-4 transition-colors duration-300">

    <div
        class="w-full max-w-md bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-8 border border-gray-100 dark:border-gray-700">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-600 dark:text-blue-400 tracking-wide">Ghibli API</h1>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">banpay Challenge</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <h2 class="text-xl font-semibold text-center">Iniciar Sesión</h2>
            <div>
                <label class="block text-sm font-medium mb-1">Correo Electrónico</label>
                <input type="email" name="email" required
                    class="w-full px-4 py-2 rounded-lg border dark:border-gray-600 bg-transparent focus:ring-2 focus:ring-blue-500 outline-none transition">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Contraseña</label>
                <input type="password" name="password" required
                    class="w-full px-4 py-2 rounded-lg border dark:border-gray-600 bg-transparent focus:ring-2 focus:ring-blue-500 outline-none transition">
            </div>
            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition shadow-md">
                Ingresar
            </button>
            <p class="text-center text-sm text-gray-500 dark:text-gray-400 mt-4">
                ¿No tienes cuenta?
                <button type="button" id="btnShowSignup"
                    class="text-blue-600 dark:text-blue-400 font-medium hover:underline focus:outline-none">Registrate
                    aquí</button>
            </p>
        </form>

        <form id="signupForm" class="space-y-5 hidden">
            <h2 class="text-xl font-semibold text-center">Crear Usuario Nuevo</h2>
            <div>
                <label class="block text-sm font-medium mb-1">Nombre Completo</label>
                <input type="text" name="nombre" required
                    class="w-full px-4 py-2 rounded-lg border dark:border-gray-600 bg-transparent focus:ring-2 focus:ring-blue-500 outline-none transition">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Correo Electrónico</label>
                <input type="email" name="email" required
                    class="w-full px-4 py-2 rounded-lg border dark:border-gray-600 bg-transparent focus:ring-2 focus:ring-blue-500 outline-none transition">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Contraseña</label>
                <input type="password" name="password" required
                    class="w-full px-4 py-2 rounded-lg border dark:border-gray-600 bg-transparent focus:ring-2 focus:ring-blue-500 outline-none transition">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Rol de Acceso (Permiso Ghibli)</label>
                <select name="rol" required
                    class="w-full px-4 py-2 rounded-lg border dark:border-gray-600 bg-gray-50 dark:bg-gray-700 focus:ring-2 focus:ring-blue-500 outline-none transition">
                    <option value="films">Films (Películas)</option>
                    <option value="people">People (Personajes)</option>
                    <option value="locations">Locations (Lugares)</option>
                    <option value="species">Species (Especies)</option>
                    <option value="vehicles">Vehicles (Vehículos)</option>
                </select>
            </div>
            <button type="submit"
                class="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-2.5 rounded-lg transition shadow-md">
                Registrarse
            </button>
            <p class="text-center text-sm text-gray-500 dark:text-gray-400 mt-4">
                ¿Ya tienes cuenta?
                <button type="button" id="btnShowLogin"
                    class="text-blue-600 dark:text-blue-400 font-medium hover:underline focus:outline-none">Inicia
                    sesión</button>
            </p>
        </form>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');
        const btnShowSignup = document.getElementById('btnShowSignup');
        const btnShowLogin = document.getElementById('btnShowLogin');

        btnShowSignup.addEventListener('click', () => {
            loginForm.classList.add('hidden');
            signupForm.classList.remove('hidden');
        });

        btnShowLogin.addEventListener('click', () => {
            signupForm.classList.add('hidden');
            loginForm.classList.remove('hidden');
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(loginForm);

            try {
                const response = await fetch('/User/login', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    alert('Credenciales incorrectas o usuario inexistente.');
                    return;
                }

                const user = await response.json();

                sessionStorage.setItem('userId', user.id);
                sessionStorage.setItem('userRole', user.rol);

                if (user.rol === 'admin') {
                    window.location.href = '/admin';
                } else {
                    window.location.href = '/dashboard';
                }

            } catch (error) {
                alert('Error al conectar con el servidor de autenticación.');
            }
        });

        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(signupForm);

            try {
                const response = await fetch('/User/signUp', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    alert('Error en el registro. Es posible que el correo electrónico ya exista.');
                    return;
                }

                alert('Usuario registrado con éxito. Ahora puedes iniciar sesión.');
                signupForm.reset();
                btnShowLogin.click();

            } catch (error) {
                alert('Error al conectar con el servidor durante el registro.');
            }
        });
    </script>
</body>

</html>
